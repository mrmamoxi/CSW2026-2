<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento no Eixo Transversal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        h1 span {
            color: #ef4444;
            font-size: 1.2rem;
            font-weight: 500;
            margin-left: 8px;
        }

        p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.5;
        }

        .section-group {
            margin-bottom: 30px;
        }

        .label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .flex-container {
            display: flex;
            background-color: #1e293b;
            border-radius: 8px;
            padding: 16px;
            height: 140px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #334155;
            gap: 12px;
        }

        .box {
            width: 50px;
            background-color: #ef4444;
            border-radius: 6px;
            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.3);
        }

       
        .box-1 { height: 45px; }
        .box-2 { height: 100px; }
        .box-3 { height: 70px; }

        
        .align-flex-start {
            align-items: flex-start;
        }

        .align-center {
            align-items: center;
        }

        .align-stretch {
            align-items: stretch;
        }

       
        .align-stretch .box {
            height: auto; 
        }

        .align-flex-end {
            align-items: flex-end;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Alinhamento no Eixo Transversal <span>(align-items)</span></h1>
           
        </header>

        <div class="section-group">
            <div class="label">flex-start</div>
            <div class="flex-container align-flex-start">
                <div class="box box-1"></div>
                <div class="box box-2"></div>
                <div class="box box-3"></div>
            </div>
        </div>

        <div class="section-group">
            <div class="label">center</div>
            <div class="flex-container align-center">
                <div class="box box-1"></div>
                <div class="box box-2"></div>
                <div class="box box-3"></div>
            </div>
        </div>

        <div class="section-group">
            <div class="label">stretch</div>
            <div class="flex-container align-stretch">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
        </div>

        <div class="section-group">
            <div class="label">flex-end</div>
            <div class="flex-container align-flex-end">
                <div class="box box-1"></div>
                <div class="box box-2"></div>
                <div class="box box-3"></div>
            </div>
        </div>
    </div>

</body>
</html>
